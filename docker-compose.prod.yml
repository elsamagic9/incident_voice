services:
  incident-voice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-voice-app
    ports:
      - "8000:8000"
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - TTS_PROVIDER=${TTS_PROVIDER:-edge-tts}
      - INFRASTRUCTURE_MODE=${INFRASTRUCTURE_MODE:-simulation}
      - OPERATOR_ACCESS_TOKEN=${OPERATOR_ACCESS_TOKEN:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - incident-payment
      - incident-redis
      - incident-order-db

  incident-payment:
    build:
      context: ./infrastructure/payment-service
      dockerfile: Dockerfile
    container_name: incident-payment
    ports:
      - "127.0.0.1:8081:8080"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 2

  incident-redis:
    image: redis:7-alpine
    container_name: incident-redis
    ports:
      - "127.0.0.1:6380:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 2

  incident-order-db:
    image: postgres:15-alpine
    container_name: incident-order-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sre_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    ports:
      - "127.0.0.1:5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 2
