services:
  - type: web
    name: incident-voice
    runtime: docker
    # Low-memory image: the free plan has 0.1 CPU / 512 MB, which cannot hold a
    # frontend build (tsc peaks near 364 MB). This ships the prebuilt bundle.
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    # Free plan: 0.1 CPU / 512 MB. The service sleeps after 15 minutes without
    # inbound traffic and wakes in about a minute. Its filesystem is ephemeral,
    # so the local SQLite session/WAL store resets on every sleep and redeploy.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: INFRASTRUCTURE_MODE
        value: simulation
      - key: LLM_PROVIDER
        value: assemblyai
      # No OPERATOR_ACCESS_TOKEN: the public demo opens without a sign-in wall so a
      # judge can click through immediately. Every infrastructure effect is
      # simulated, so an unauthenticated visitor cannot touch a real system.
