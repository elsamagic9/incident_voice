services:
  - type: web
    name: incident-voice
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: INFRASTRUCTURE_MODE
        value: simulation
      - key: LLM_PROVIDER
        value: assemblyai
      - key: OPERATOR_ACCESS_TOKEN
        sync: false
