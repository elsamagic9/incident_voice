version: '3.8'

services:
  incident-voice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-voice-app
    ports:
      - "8000:8000"
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - incident-payment
      - incident-redis
      - incident-order-db

  incident-payment:
    build:
      context: ./infrastructure/payment-service
      dockerfile: Dockerfile
    container_name: incident-payment
    ports:
      - "8081:8080"
    restart: always

  incident-redis:
    image: redis:7-alpine
    container_name: incident-redis
    ports:
      - "6380:6379"
    restart: always

  incident-order-db:
    image: postgres:15-alpine
    container_name: incident-order-db
    environment:
      POSTGRES_USER: sre_admin
      POSTGRES_PASSWORD: incident_secret
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    restart: always
